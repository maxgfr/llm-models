name: Publish package to npm

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_CONFIG_PROVENANCE: true
      # npm version/publish run inside a bun workspace: never let npm reinstall
      # it (it rejects llm-connect's workspace:^ dependency on llm-models)
      NPM_CONFIG_WORKSPACES_UPDATE: false
    outputs:
      new_release_published: ${{ steps.check_release.outputs.new_release }}
      new_release_version: ${{ steps.version_after.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails fast on a broken build. Each published bundle is rebuilt by
      # semantic-release (@semantic-release/exec prepareCmd) once package.json
      # carries the new version, since the build inlines it.
      - name: Build
        run: bun run build:all

      # One semantic-release run per package, from the package folder:
      # semantic-release-monorepo only counts the commits touching that folder.
      - name: Get llm-models version before release
        id: version_before
        working-directory: packages/llm-models
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Release llm-models
        working-directory: packages/llm-models
        run: bun run release

      - name: Get llm-models version after release
        id: version_after
        working-directory: packages/llm-models
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if a new llm-models version was released
        id: check_release
        run: |
          if [ "${{ steps.version_before.outputs.version }}" != "${{ steps.version_after.outputs.version }}" ]; then
            echo "new_release=true" >> $GITHUB_OUTPUT
            echo "✅ New version released: ${{ steps.version_after.outputs.version }}"
          else
            echo "new_release=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No new version released"
          fi

      # The first llm-connect version was published by hand: npm's trusted
      # publishing only attaches to a package that already exists.
      - name: Release llm-connect
        working-directory: packages/llm-connect
        run: |
          if npm view llm-connect version >/dev/null 2>&1; then
            bun run release
          else
            echo "::notice::llm-connect is not on npm yet; publish its first version by hand"
          fi

  build-binaries:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all binaries
        working-directory: packages/llm-models
        run: |
          mkdir -p dist
          bun build src/index.ts --compile --target=bun-linux-x64 --outfile dist/llm-models-linux-x64
          bun build src/index.ts --compile --target=bun-linux-arm64 --outfile dist/llm-models-linux-arm64
          bun build src/index.ts --compile --target=bun-darwin-x64 --outfile dist/llm-models-macos-x64
          bun build src/index.ts --compile --target=bun-darwin-arm64 --outfile dist/llm-models-macos-arm64
          bun build src/index.ts --compile --target=bun-windows-x64 --outfile dist/llm-models-win-x64.exe

      - name: Create checksums
        working-directory: packages/llm-models/dist
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: |
            packages/llm-models/dist/llm-models-linux-x64
            packages/llm-models/dist/llm-models-linux-arm64
            packages/llm-models/dist/llm-models-macos-x64
            packages/llm-models/dist/llm-models-macos-arm64
            packages/llm-models/dist/llm-models-win-x64.exe
            packages/llm-models/dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
